[project]
name = "reuters-climate-paragraph"
version = "0.1.0"
description = "Deterministic newsroom paragraph generator for Reuters Climate Monitor data"
requires-python = ">=3.11"
dependencies = [
  "click==8.3.1",
  "mapbox-vector-tile==2.2.0",
  "pmtiles==3.8.1",
]

[project.scripts]
climate-monitor = "reuters_climate_paragraph.cli:cli"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "pytest==8.4.2",
  "ruff==0.13.1",
  "ty==0.0.1a21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/reuters_climate_paragraph"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
